<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Triagem - HV</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
  .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  
  .btn-tv {
    background: #28a745;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    margin-left: 8px;
  }
  .btn-tv:hover { background: #1e7e34; }

  .btn-selecionar {
    background: #007bff;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
  }
  .btn-selecionar:hover { background: #0069d9; }

  .pacientes-fila {
    margin-bottom: 30px;
    background: #f0f4ff;
    border-radius: 8px;
    padding: 16px;
    border: 1px solid #d0d8f0;
  }
  .pacientes-fila h3 {
    margin-top: 0;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pacientes-fila h3 span {
    font-size: 13px;
    font-weight: normal;
    color: #666;
  }
  .fila-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: white;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
    border: 1px solid #dce4ff;
  }
  .fila-item img {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 12px;
    border: 1px solid #ccc;
  }
  .fila-item-info {
    display: flex;
    align-items: center;
  }
  .fila-item strong { font-size: 15px; }
  .fila-item small { color: #888; font-size: 12px; }
  
  .btn-abrir-tv {
    display: inline-block;
    background: #17a2b8;
    color: white;
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }
  .btn-abrir-tv:hover { background: #117a8b; }

  /* Campos do formulário */
  input, select, textarea { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
  
  .vermelho { background-color: #ff4d4d; color: white; padding: 12px; border-radius: 5px; font-weight: bold; text-align: center; }
  .amarelo { background-color: #ffcc00; color: #333; padding: 12px; border-radius: 5px; font-weight: bold; text-align: center; }
  .verde { background-color: #28a745; color: white; padding: 12px; border-radius: 5px; font-weight: bold; text-align: center; }
</style>
</head>

<body>
<div class="container">

  <!-- Cabeçalho -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0;">🏥 Triagem Hospitalar</h2>
    <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">📺 Abrir Tela da TV</button>
  </div>

  <!-- Fila de pacientes da Recepção -->
  <div class="pacientes-fila">
    <h3>
      Pacientes Aguardando Triagem
      <span>Selecione para preencher os dados ou chamar na TV</span>
    </h3>
    <div id="fila-pacientes">
      <p style="color:#888; text-align:center;">Carregando...</p>
    </div>
    <button onclick="carregarPacientes()" style="margin-top:8px; background:#6c757d; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;">🔄 Atualizar Fila</button>
  </div>

  <hr style="margin: 25px 0;">

  <h3>Preenchimento da Triagem</h3>
  
  <!-- Guarda o ID do paciente cadastrado -->
  <input type="hidden" id="paciente_id">

  <label for="nome">Nome do Paciente</label>
  <input id="nome" placeholder="Nome do paciente" required readonly style="background:#e9ecef;">

  <!-- Exemplo de container no HTML da Triagem -->
<div class="card-paciente-detalhes">
  <!-- Exibição da Foto em Base64 -->
  <div class="foto-container" style="text-align: center; margin-bottom: 15px;">
    <img id="triagem-foto-paciente" src="" alt="Foto do Paciente" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; display: none; border: 2px solid #ccc;">
  </div>

  <p><strong>Nome:</strong> <span id="triagem-nome"></span></p>
  <p><strong>CPF:</strong> <span id="triagem-cpf"></span></p>
  <p><strong>Data de Nasc.:</strong> <span id="triagem-nasc"></span></p>
  <p><strong>Gênero:</strong> <span id="triagem-genero"></span></p>
  <p><strong>Mãe:</strong> <span id="triagem-mae"></span></p>
  <p><strong>Atendimento:</strong> <span id="triagem-tipo"></span></p>
  <p><strong>Responsável:</strong> <span id="triagem-responsavel"></span></p>
</div>

  <label for="sintoma">Sintomas Apresentados</label>
  <input id="sintoma" list="lista-sintomas" placeholder="Digite ou selecione o sintoma principal" required>
  <datalist id="lista-sintomas">
    <option value="Dor leve">
    <option value="Resfriado">
    <option value="Coriza">
    <option value="Tosse">
    <option value="Febre">
    <option value="Vômito">
    <option value="Diarreia">
    <option value="Falta de ar moderada">
    <option value="Falta de ar grave">
    <option value="Suspeita de infarto">
    <option value="Suspeita de AVC">
    <option value="Convulsão">
    <option value="Hemorragia">
  </datalist>

  <label for="temp">Temperatura Corporal (°C)</label>
  <input id="temp" type="number" step="0.1" placeholder="Ex: 36.5" required>

  <label for="alergia">Alergias Medicamentosas / Alimentares</label>
  <input id="alergia" placeholder="Ex: Dipirona, Penicilina, Nenhuma">

  <label for="observacao">Observações Adicionais da Enfermagem</label>
  <textarea id="observacao" rows="3" placeholder="Observações médicas ou relato do paciente"></textarea>

  <div id="resultado"></div>

  <button onclick="salvar()" style="margin-top: 15px; width:100%; padding:14px; background:#28a745; color:white; border:none; border-radius:5px; font-size:16px; font-weight:bold; cursor:pointer;">Salvar e Encaminhar para o Médico</button>

</div>

<script>
let listaPacientesAtuais = [];

// 1. Função isolada para preencher os dados do paciente na tela de Triagem
function exibirDetalhesTriagem(paciente) {
  document.getElementById('triagem-nome').textContent = paciente.nome || '-';
  document.getElementById('triagem-cpf').textContent = paciente.cpf || '-';
  document.getElementById('triagem-nasc').textContent = paciente.dataNascimento || paciente.nascimento || '-';
  document.getElementById('triagem-genero').textContent = paciente.genero || '-';
  document.getElementById('triagem-mae').textContent = paciente.nomeMae || paciente.mae || '-';
  document.getElementById('triagem-tipo').textContent = paciente.tipoAtendimento || paciente.tipo || '-';
  document.getElementById('triagem-responsavel').textContent = paciente.responsavelLegal || paciente.responsavel || '-';

  // Carregar e exibir a Foto em Base64 ou URL
  const imgElement = document.getElementById('triagem-foto-paciente');
  const fotoSrc = paciente.fotoBase64 || paciente.foto;
  
  if (fotoSrc) {
    imgElement.src = fotoSrc;
    imgElement.style.display = 'inline-block';
  } else {
    imgElement.style.display = 'none';
  }
}

// 2. Carregar lista da fila da Recepção
function carregarPacientes() {
  fetch("/pacientes")
    .then(r => r.json())
    .then(pacientes => {
      listaPacientesAtuais = pacientes;
      const div = document.getElementById("fila-pacientes");

      // Exibe apenas quem possui status "triagem"
      const fila = pacientes.filter(p => p.status === "triagem");

      if (fila.length === 0) {
        div.innerHTML = "<p style='color:#888; text-align:center;'>Nenhum paciente aguardando triagem no momento.</p>";
        return;
      }

      div.innerHTML = "";
      fila.forEach(p => {
        const item = document.createElement("div");
        item.className = "fila-item";
        
        const fotoSrc = p.fotoBase64 || p.foto || 'https://via.placeholder.com/45?text=Foto';

        item.innerHTML = `
          <div class="fila-item-info">
            <img src="${fotoSrc}" alt="Foto Paciente">
            <div>
              <strong>${p.nome}</strong><br>
              <small>CPF: ${p.cpf || "—"} | Tipo: ${p.tipoAtendimento || p.tipo || "—"}</small>
            </div>
          </div>
          <div>
            <button class="btn-selecionar" onclick="selecionarPaciente(${p.id})">📋 Selecionar</button>
            <button class="btn-tv" onclick="chamarNaTV('${p.nome}')">📺 Chamar na TV</button>
          </div>
        `;
        div.appendChild(item);
      });
    })
    .catch(() => {
      document.getElementById("fila-pacientes").innerHTML =
        "<p style='color:red;'>Erro ao carregar a fila de pacientes.</p>";
    });
}

// 3. Ao clicar em Selecionar, atualiza o campo oculto, o input de nome e exibe o card de detalhes
function selecionarPaciente(id) {
  const paciente = listaPacientesAtuais.find(p => p.id === id);
  if (paciente) {
    document.getElementById("paciente_id").value = paciente.id;
    document.getElementById("nome").value = paciente.nome;
    
    // Chama a função para preencher a div de detalhes e foto
    exibirDetalhesTriagem(paciente);
    
    document.getElementById("sintoma").focus();
  }
}

function chamarNaTV(nome) {
  fetch("/tv/chamar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      localTipo: "TRIAGEM",
      localNumero: "01",
      paciente: nome
    })
  })
  .then(r => r.json())
  .then(() => {
    alert("✅ " + nome + " foi chamado(a) na TV para a Triagem!");
  });
}

function normalizarTexto(str) {
  return str.toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "_");
}

function classificarRisco(sintomaBruto, temperatura) {
  const sintoma = normalizarTexto(sintomaBruto);
  const vermelhos = ["suspeita_de_infarto", "infarto", "suspeita_de_avc", "avc", "convulsao", "hemorragia", "falta_de_ar_grave"];
  const amarelos = ["febre", "vomito", "diarreia", "falta_de_ar_moderada"];

  if (temperatura >= 39) return "vermelho";
  if (vermelhos.some(v => sintoma.includes(v))) return "vermelho";
  if (amarelos.some(a => sintoma.includes(a))) return "amarelo";
  return "verde";
}

function salvar() {
  const pacienteId = document.getElementById("paciente_id").value;
  const nome = document.getElementById("nome").value;
  const sintoma = document.getElementById("sintoma").value;
  const temperatura = Number(document.getElementById("temp").value);
  const alergia = document.getElementById("alergia").value || "Nenhuma";
  const observacao = document.getElementById("observacao").value || "Nenhuma";

  if (!pacienteId || !nome) {
    alert("Por favor, selecione um paciente da fila acima antes de salvar.");
    return;
  }

  if (!sintoma || !temperatura) {
    alert("Por favor, preencha o Sintoma e a Temperatura.");
    return;
  }

  const risco = classificarRisco(sintoma, temperatura);

  const payload = {
    pacienteId: Number(pacienteId),
    nome: nome,
    sintoma: sintoma,
    temperatura: temperatura,
    alergia: alergia,
    observacao: observacao,
    risco: risco
  };

  fetch("/triagem", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(r => {
    if (!r.ok) throw new Error("Erro na requisição ao salvar triagem");
    return r.json();
  })
  .then(data => {
    const resultado = document.getElementById("resultado");
    resultado.className = risco;
    resultado.innerHTML = "Classificação de Risco Definida: " + risco.toUpperCase();

    alert("✅ Triagem concluída com sucesso! Paciente encaminhado para o médico.");

    // Limpar campos
    document.getElementById("paciente_id").value = "";
    document.getElementById("nome").value = "";
    document.getElementById("sintoma").value = "";
    document.getElementById("temp").value = "";
    document.getElementById("alergia").value = "";
    document.getElementById("observacao").value = "";

    // Resetar o container de exibição do paciente
    exibirDetalhesTriagem({});

    // Recarregar a fila
    carregarPacientes();
  })
  .catch(err => {
    console.error(err);
    alert("❌ Erro ao salvar a triagem no servidor.");
  });
}

// Execuções iniciais
carregarPacientes();
setInterval(carregarPacientes, 10000);

</script>
</body>
</html>

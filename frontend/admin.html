<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | HealthVision</title>
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Estilos atualizados que preparamos */
    :root {
      --primary-color: #014227;
      --primary-hover: #025b36;
      --bg-color: #f8f2ec;
      --card-bg: #ffffff;
      --border-color: #e7ded5;
      --text-primary: #222222;
      --text-secondary: #6b625b;
    }

    body {
      background-color: var(--bg-color);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-shadow: 0 12px 35px rgba(1, 66, 39, 0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #f3ece4;
      color: var(--primary-color);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Painel do Administrador</h1>

  <div class="admin-grid">
    
    <!-- CARD ONDE FICA A TABELA DE LOGS -->
    <div class="card">
      <h3>Logs de Auditoria em Tempo Real</h3>
      <p>Ações registradas pelos usuários no sistema.</p>

      <table>
        <thead>
          <tr>
            <th>Data/Hora</th>
            <th>Usuário</th>
            <th>Perfil</th>
            <th>Ação</th>
          </tr>
        </thead>
        <!-- O id é capturado pelo document.getElementById -->
        <tbody id="tabela-logs-body">
          <tr>
            <td colspan="4" style="text-align: center; color: #6b625b;">Carregando logs...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- SCRIPT QUE ATUALIZA A TABELA VIA ID -->
  <script>
    async function carregarLogs() {
      // Captura a tag <tbody> pelo ID do HTML
      const tbody = document.getElementById("tabela-logs-body");

      try {
        const response = await fetch("/api/logs");
        if (!response.ok) throw new Error("Erro ao carregar logs");

        const logs = await response.json();

        if (!logs || logs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="4" style="text-align: center;">Nenhum log registrado.</td>
            </tr>`;
          return;
        }

        // Insere as linhas dentro do espaço da tabela no HTML
        tbody.innerHTML = logs.map(log => {
          const dataFormatada = new Date(log.timestamp).toLocaleString("pt-BR");
          return `
            <tr>
              <td>${dataFormatada}</td>
              <td><strong>${log.user || 'Sistema'}</strong></td>
              <td>${log.role || 'Geral'}</td>
              <td>${log.message}</td>
            </tr>
          `;
        }).join("");

      } catch (error) {
        console.error(error);
        tbody.innerHTML = `
          <tr>
            <td colspan="4" style="text-align: center; color: #b42318;">Erro ao buscar dados.</td>
          </tr>`;
      }
    }

    // Executa assim que a página abre
    document.addEventListener("DOMContentLoaded", carregarLogs);

    // Atualiza o espacinho da tabela a cada 3 segundos
    setInterval(carregarLogs, 3000);
  </script>

</body>
</html>

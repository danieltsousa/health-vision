<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HealthVision</title>
  <link rel="stylesheet" href="css/style.css">
  
</head>
<body class="login-page">

  <!-- Conteúdo Principal do Login -->
  <main class="login-container">
    <h1>HealthVision Hospitalar</h1>

    <form id="form-login" onsubmit="login(event)">
      <div class="tiles-grid">
        
        <!-- Tile do Usuário -->
        <div class="tile tile-white">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" placeholder="Digite seu usuário..." required autocomplete="username">
        </div>

        <!-- Tile da Senha -->
        <div class="tile tile-white">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha..." required autocomplete="current-password">
        </div>

        <!-- Tile Botão Entrar -->
        <button type="submit" class="tile tile-button tile-green">
          Entrar
        </button>

      </div>
    </form>
  </main>

  <!-- Rodapé Fixo com a Logo -->
  <footer class="rodape-sistema">
    <div class="rodape-conteudo">
      <img src="image.png" alt="HealthVision Logo" class="logo-rodape">
      <span class="rodape-texto">© 2026 HealthVision</span>
    </div>
  </footer>

  <script>
  function login(event) {
    if (event) event.preventDefault(); // Impede o envio do formulário padrão

    const usuarioInput = document.getElementById("usuario").value;
    const senhaInput = document.getElementById("senha").value;

    fetch("http://localhost:3000/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        usuario: usuarioInput,
        senha: senhaInput
      })
    })
    .then(r => r.json())
    .then(data => {
      if (data.tipo === "triagem") location.href = "triagem.html";
      else if (data.tipo === "medico") location.href = "medico.html";
      else if (data.tipo === "atendimento") location.href = "atendimento.html";
      else alert("Tipo de usuário inválido ou credenciais incorretas.");
    })
    .catch(err => {
      console.error("Erro ao realizar login:", err);
      alert("Falha de conexão com o servidor.");
    });
  }
  </script>

</body>
</html>

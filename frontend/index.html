<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#014227">
  <title>Login | HealthVision Hospitalar</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Estilos exclusivos da tela de login.
       Não alteram o restante do sistema. -->
  <style>
    .login-page {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f8f2ec;
    }

    .login-container {
      width: min(100%, 430px);
      background: #fff;
      border: 1px solid #e7ded5;
      box-shadow: 0 12px 35px rgba(1, 66, 39, 0.12);
      padding: 38px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo {
      display: block;
      width: 168px;
      height: 168px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .login-brand h1 {
      margin: 0;
      color: #014227;
      font-size: clamp(24px, 5vw, 30px);
      line-height: 1.2;
      font-weight: 700;
    }

    .login-brand p {
      margin: 8px 0 0;
      color: #6b625b;
      font-size: 14px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .login-field label {
      color: #014227;
      font-size: 14px;
      font-weight: 800;
    }

    .login-field input {
      width: 100%;
      min-height: 48px;
      margin: 0;
      padding: 12px 14px;
      border: 1px solid #d8cec4;
      border-radius: 4px;
      background: #fff;
      color: #222;
      font-size: 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .login-field input::placeholder {
      color: #9b938c;
    }

    .login-field input:focus {
      border-color: #014227;
      box-shadow: 0 0 0 3px rgba(1, 66, 39, 0.10);
    }

    .login-password-wrapper {
      position: relative;
    }

    .login-password-wrapper input {
      padding-right: 78px;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #014227;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 7px;
    }

    .login-submit {
      width: 100%;
      min-height: 50px;
      margin-top: 4px;
      border: 0;
      border-radius: 4px;
      background: #014227;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s, opacity .2s;
    }

    .login-submit:hover {
      background: #025b36;
    }

    .login-submit:active {
      transform: translateY(1px);
    }

    .login-submit:disabled {
      opacity: .65;
      cursor: wait;
    }

    .login-message {
      min-height: 20px;
      margin: 2px 0 0;
      color: #b42318;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .login-footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #eee6df;
      text-align: center;
      color: #817970;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .login-page {
        padding: 16px;
      }

      .login-container {
        padding: 28px 22px;
      }
    }
  </style>
</head>

<body class="login-page">

  <main class="login-container" aria-labelledby="login-title">

    <header class="login-brand">
      <img
        src="image.png"
        alt="Logo HealthVision"
        class="login-logo"
      >

      <h1 id="login-title">HealthVision Hospitalar</h1>
      <p>Acesso ao sistema hospitalar</p>
    </header>

    <form id="form-login" class="login-form">

      <div class="login-field">
        <label for="usuario">Usuário</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="Digite seu usuário"
          autocomplete="username"
          required
          autofocus
        >
      </div>

      <div class="login-field">
        <label for="senha">Senha</label>

        <div class="login-password-wrapper">
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            id="toggle-password"
            class="toggle-password"
            aria-label="Mostrar senha"
            aria-pressed="false"
          >
            Mostrar
          </button>
        </div>
      </div>

      <p id="login-message" class="login-message" role="alert" aria-live="polite"></p>

      <button type="submit" id="btn-login" class="login-submit">
        Entrar no sistema
      </button>
    </form>

    <footer class="login-footer">
      © 2026 HealthVision Hospitalar
    </footer>

  </main>

  <script>
    const formLogin = document.getElementById("form-login");
    const usuarioInput = document.getElementById("usuario");
    const senhaInput = document.getElementById("senha");
    const btnLogin = document.getElementById("btn-login");
    const loginMessage = document.getElementById("login-message");
    const togglePassword = document.getElementById("toggle-password");

    // Mostra/oculta a senha sem alterar o funcionamento do login.
    togglePassword.addEventListener("click", () => {
      const mostrando = senhaInput.type === "text";

      senhaInput.type = mostrando ? "password" : "text";
      togglePassword.textContent = mostrando ? "Mostrar" : "Ocultar";
      togglePassword.setAttribute("aria-label", mostrando ? "Mostrar senha" : "Ocultar senha");
      togglePassword.setAttribute("aria-pressed", String(!mostrando));
    });

    formLogin.addEventListener("submit", async (event) => {
      event.preventDefault();

      const usuario = usuarioInput.value.trim();
      const senha = senhaInput.value;

      loginMessage.textContent = "";

      if (!usuario || !senha) {
        loginMessage.textContent = "Informe o usuário e a senha.";
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = "Entrando...";

      try {
        // URL relativa: funciona localmente e também no Render,
        // desde que o frontend e a API sejam servidos pelo mesmo domínio.
        const response = await fetch("/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ usuario, senha })
        });

        let data = {};
        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          throw new Error(data.mensagem || data.erro || "Usuário ou senha inválidos.");
        }

        switch (data.tipo) {
          case "triagem":
            window.location.href = "triagem.html";
            break;

          case "medico":
            window.location.href = "medico.html";
            break;

          case "atendimento":
            window.location.href = "atendimento.html";
            break;

          default:
            throw new Error("O servidor retornou um tipo de usuário inválido.");
        }

      } catch (error) {
        console.error("Erro no login:", error);

        loginMessage.textContent =
          error.message === "Failed to fetch"
            ? "Não foi possível conectar ao servidor."
            : error.message;

        btnLogin.disabled = false;
        btnLogin.textContent = "Entrar no sistema";
      }
    });
  </script>

</body>
</html>
